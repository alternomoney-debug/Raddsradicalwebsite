<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/lite.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wrong turn (Rad)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d11">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b0d11'/%3E%3Cpath%20transform='translate%28-3%203%29'%20fill='%235b9be6'%20fill-rule='evenodd'%20d='M18%2014H38C47%2014%2052%2019%2052%2026.5C52%2032%2049%2036%2043.5%2037.8L53%2050H41L33%2039H28V50H18ZM28%2022V31H37C40.5%2031%2042%2029.5%2042%2026.5C42%2023.5%2040.5%2022%2037%2022Z'/%3E%3Cpath%20fill='%23f1f3f5'%20fill-rule='evenodd'%20d='M18%2014H38C47%2014%2052%2019%2052%2026.5C52%2032%2049%2036%2043.5%2037.8L53%2050H41L33%2039H28V50H18ZM28%2022V31H37C40.5%2031%2042%2029.5%2042%2026.5C42%2023.5%2040.5%2022%2037%2022Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    color-scheme: dark;
    --bg: #0b0d11; --ink: #f1f3f5; --muted: #a7b0ba; --line: #252a31; --accent: #5b9be6;
    --font: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
    --max: 2200px; --gutter: clamp(20px, 4vw, 64px);
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  #c{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .page{ position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; }
  ::selection{ background: var(--accent); color: var(--bg); }
  a{ color: var(--ink); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap{ width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  .top{ padding-top: 26px; padding-bottom: 26px; }
  .top a{ font-weight: 800; font-size: 22px; letter-spacing: -0.03em; text-decoration: none; }

  main{ flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 4vh; padding-bottom: 8vh; }

  .code{
    position: relative;
    display: inline-block;
    align-self: flex-start;
    margin: 0;
    font-size: clamp(140px, 30vw, 460px);
    font-weight: 800;
    line-height: 0.82;
    letter-spacing: -0.05em;
  }
  .code .rough, .code .clean{ display: block; }
  .code .rough{ position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 1.5px var(--accent); transform: translate(-0.035em, 0.03em) rotate(-2deg); }
  .code .clean{ position: relative; }
  @media (prefers-reduced-motion: no-preference){
    .code .rough{ animation: rough-in 0.5s ease-out both; }
    .code .clean{ animation: clean-in 0.35s ease-out 0.55s both; }
  }
  @keyframes rough-in{ from{ opacity: 0; transform: translate(-0.09em, 0.07em) rotate(-5deg); } }
  @keyframes clean-in{ from{ opacity: 0; } }

  h1{ margin: 40px 0 8px; font-size: clamp(32px, 5vw, 72px); font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .sub{ margin: 0 0 48px; font-size: clamp(20px, 2vw, 28px); color: var(--muted); }

  .links{ border-top: 1px solid var(--line); max-width: 900px; }
  .links a{
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 20px 0; border-bottom: 1px solid var(--line);
    text-decoration: none; transition: padding-left 0.25s ease;
  }
  .links a:hover{ padding-left: 12px; }
  .links .label{ font-size: clamp(28px, 3.6vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .links a:hover .label{ color: var(--accent); }
  .links .note{ color: var(--muted); }

  footer{ padding-top: 40px; padding-bottom: 60px; font-size: 14px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="page">
  <div class="wrap top"><a href="https://raddwastaken.art/">rad</a></div>

  <main class="wrap">
    <p class="code" aria-hidden="true"><span class="rough">404</span><span class="clean">404</span></p>
    <h1>Wrong turn.</h1>
    <p class="sub">There's no page here. Maybe sooner or later.</p>
    <nav class="links" aria-label="Places that exist">
      <a href="https://raddwastaken.art/"><span class="label">Back home</span><span class="note">The main page</span></a>
      <a href="https://raddwastaken.art/elsewhere/"><span class="label">Elsewhere</span><span class="note">All about me</span></a>
      <a href="https://raddwastaken.art/battleship/"><span class="label">Battleship</span><span class="note">Since you're lost anyway</span></a>
    </nav>
  </main>

  <footer class="wrap">ASCII background by TheMonHub on Discord</footer>
</div>

<script>
// Background animation generated using https://baptiste-schlienger.com/experiments/animatedascii/index.html
// Customized and integrated by TheMonHub; recolored to neutral grey with blue peaks
(function(){
  if (window.__LITE) return;   // Lite mode: leave the background off
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var w, h, cols, rows, frame = 0;
  var SEED = crypto.getRandomValues(new Uint32Array(1))[0];

  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var settings = {
    noiseLevel: 0.013,
    speed: 0.6,
    fontSize: 13,
    colors: ["#0b0d11", "#111419", "#171b20", "#1e2329", "#272d35", "#333b45", "#434e5b", "#5b9be6", "#9cc4f2"],
    bgColor: "#0b0d11",
    charSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&{}[]()<>*+-=/"
  };

  var charGrid = [];
  function init(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.ceil(w / (settings.fontSize * 0.6));
    rows = Math.ceil(h / settings.fontSize);
    charGrid = [];
    for (let r = 0; r < rows; r++){
      let row = [];
      for (let c = 0; c < cols; c++) row.push(settings.charSet[Math.floor(rand() * settings.charSet.length)]);
      charGrid.push(row);
    }
  }

  var p = new Uint8Array(512);
  (function(){
    var perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 256; i++) p[i] = p[i + 256] = perm[i];
  })();

  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function lerp(t,a,b){ return a+t*(b-a); }
  function grad(h,x,y,z){
    const i=h&15, u=i<8?x:y, v=i<4?y:i==12||i==14?x:z;
    return((i&1)==0?u:-u)+((i&2)==0?v:-v);
  }
  function perlin(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), ww=fade(z);
    const A=p[X]+Y, AA=p[A]+Z, AB=p[A+1]+Z;
    const B=p[X+1]+Y, BA=p[B]+Z, BB=p[B+1]+Z;
    return lerp(ww,
      lerp(v, lerp(u,grad(p[AA],x,y,z),grad(p[BA],x-1,y,z)), lerp(u,grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z))),
      lerp(v, lerp(u,grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1)), lerp(u,grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1)))
    );
  }

  var mouse = { x: -1000, y: -1000 };
  window.addEventListener('pointermove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseout', function(e){ if (!e.relatedTarget) mouse.x = -1000; });

  var running = false, scrollY = 0;

  function draw(){
    ctx.fillStyle = settings.bgColor;
    ctx.fillRect(0,0,w,h);
    ctx.font = settings.fontSize + 'px monospace';
    const cw = settings.fontSize * 0.6;
    const zOff = (frame * 0.003 + scrollY * 0.002) * settings.speed;
    for (let r=0; r<rows; r++){
      for (let c=0; c<cols; c++){
        const x = c*cw, y = r*settings.fontSize;
        let n = perlin(c*settings.noiseLevel, r*settings.noiseLevel, zOff);
        if (mouse.x > -1000 && !reduce.matches){
          const d = Math.sqrt((x-mouse.x)**2 + (y-(mouse.y-settings.fontSize/2))**2);
          if (d < 150) n += (1 - d/150) * 0.8;
        }
        let ci = Math.floor(((n+1)/2) * settings.colors.length);
        ci = Math.max(0, Math.min(ci, settings.colors.length-1));
        ctx.fillStyle = settings.colors[ci];
        if (rand() < 0.05 * settings.speed) charGrid[r][c] = settings.charSet[Math.floor(rand()*settings.charSet.length)];
        ctx.fillText(charGrid[r][c], x, y);
      }
    }
    if (reduce.matches){ running = false; return; }
    frame++;
    requestAnimationFrame(draw);
  }
  function start(){ if (running) return; running = true; draw(); }

  function updateScroll(){
    const top = window.pageYOffset || document.documentElement.scrollTop;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? top / max : 0;
    scrollY = pct * 1500;
    canvas.style.opacity = Math.min(Math.max((1 - pct) / 2.5, 0.12), 0.4).toString();
    if (reduce.matches) draw();
  }

  window.addEventListener('scroll', updateScroll, { passive: true });
  window.addEventListener('resize', function(){ init(); reduce.matches ? draw() : start(); });
  init();
  updateScroll();
  start();
})();
</script>
</body>
</html>
