<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../lite.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The back room (Rad)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d11">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b0d11'/%3E%3Cpath%20transform='translate%28-3%203%29'%20fill='%235b9be6'%20fill-rule='evenodd'%20d='M18%2014H38C47%2014%2052%2019%2052%2026.5C52%2032%2049%2036%2043.5%2037.8L53%2050H41L33%2039H28V50H18ZM28%2022V31H37C40.5%2031%2042%2029.5%2042%2026.5C42%2023.5%2040.5%2022%2037%2022Z'/%3E%3Cpath%20fill='%23f1f3f5'%20fill-rule='evenodd'%20d='M18%2014H38C47%2014%2052%2019%2052%2026.5C52%2032%2049%2036%2043.5%2037.8L53%2050H41L33%2039H28V50H18ZM28%2022V31H37C40.5%2031%2042%2029.5%2042%2026.5C42%2023.5%2040.5%2022%2037%2022Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    color-scheme: dark;
    --bg: #0b0d11; --ink: #f1f3f5; --muted: #a7b0ba; --line: #252a31; --accent: #5b9be6;
    --font: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
    --max: 2200px; --gutter: clamp(20px, 4vw, 64px);
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; min-height: 100svh; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection{ background: var(--accent); color: var(--bg); }
  a{ color: var(--ink); text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  a:hover{ color: var(--accent); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap{ width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  .top{ padding-top: 26px; padding-bottom: 26px; }
  .top a{ font-weight: 800; font-size: 22px; letter-spacing: -0.03em; text-decoration: none; }

  main{ padding-top: 6vh; padding-bottom: 10vh; }
  h1{ margin: 0; font-size: clamp(64px, 14vw, 240px); font-weight: 800; line-height: 0.85; letter-spacing: -0.055em; }
  .sub{ margin: 28px 0 0; max-width: 40ch; font-size: clamp(20px, 2vw, 30px); color: var(--muted); }

  .count{ margin: 72px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
  .count .n{ font-size: clamp(64px, 9vw, 140px); font-weight: 800; letter-spacing: -0.05em; line-height: 1; color: var(--accent); }
  .count .t{ font-size: clamp(18px, 1.8vw, 26px); color: var(--muted); max-width: 22ch; }

  h2{ margin: 96px 0 8px; font-size: clamp(28px, 4vw, 48px); font-weight: 700; line-height: 1.05; letter-spacing: -0.025em; }
  .h2-sub{ margin: 0 0 28px; color: var(--muted); }

  .eggs{ border-top: 1px solid var(--line); }
  .egg{ display: grid; grid-template-columns: minmax(220px, 0.45fr) 1fr; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .egg .t{ font-size: clamp(22px, 2.2vw, 32px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .egg .d{ color: var(--muted); max-width: 56ch; }
  .egg.found .t{ color: var(--ink); }
  .egg.found .d{ color: var(--accent); font-weight: 600; }
  .egg.locked .t{ color: var(--muted); }

  .after{ margin-top: 72px; display: flex; flex-wrap: wrap; gap: 12px 40px; font-size: clamp(22px, 2.4vw, 34px); font-weight: 700; letter-spacing: -0.02em; }

  @media (max-width: 860px){ .egg{ grid-template-columns: 1fr; gap: 6px; } }
</style>
</head>
<body>
<div class="wrap top"><a href="../">rad</a></div>

<main class="wrap">
  <h1>You found it.</h1>
  <p class="sub">Nothing links to this page. You earned it, or you read the page source. Both count.</p>

  <p class="count" id="count" hidden><span class="n" id="n"></span><span class="t" id="t">people have found this page, you included.</span></p>

  <h2>Easter eggs</h2>
  <p class="h2-sub" id="egg-sub"></p>
  <div class="eggs" id="eggs"></div>

  <div class="after">
    <a href="https://discord.gg/j6ZrNMdA63" target="_blank" rel="noopener">Tell me in the Discord</a>
    <a href="../">Back to the main page</a>
  </div>
</main>

<script src="../config.js"></script>
<script src="../auth.js"></script>
<script>
(function(){
  // The eggs live on the main page. This page just remembers which ones you've found.
  var EGGS = [
    { id: 'konami',   title: 'The old cheat code',  hint: 'Classic games remember it. Try it on the main page.' },
    { id: 'logo',     title: 'The logo',            hint: 'Top left of the main page. It takes more than one try.' },
    { id: 'yugo',     title: 'The car',             hint: 'Type the name of my favorite car on the main page.' },
    { id: 'sandwich', title: 'The food',            hint: 'Type my favorite food, one word, on the main page.' },
    { id: 'name',     title: 'The giant name',      hint: 'The huge word at the top of the main page. It does not like being poked.' }
  ];

  function load(){ try { return JSON.parse(localStorage.getItem('rad-eggs')) || {}; } catch(e){ return {}; } }
  function render(){
  var got = load(), n = 0, list = document.getElementById('eggs'); list.innerHTML = '';
  EGGS.forEach(function(e){
    var has = !!got[e.id]; if (has) n++;
    var row = document.createElement('div'); row.className = 'egg ' + (has ? 'found' : 'locked');
    var t = document.createElement('div'); t.className = 't'; t.textContent = has ? e.title : '???';
    var d = document.createElement('div'); d.className = 'd'; d.textContent = has ? 'Found.' : e.hint;
    row.appendChild(t); row.appendChild(d); list.appendChild(row);
  });
  document.getElementById('egg-sub').textContent = n === EGGS.length
    ? 'You found all ' + EGGS.length + '. That is everything.'
    : "You've found " + n + ' of ' + EGGS.length + '. The rest have hints.';
  }
  render();
  if (window.RadAuth) RadAuth.onChange(render);   // redraw once eggs from your account have synced in

  // How many people have found this page. Uses Abacus, a free counting service. One count per browser, ever.
  var KEY = 'raddwastaken/secret-finders', base = 'https://abacus.jasoncameron.dev/';
  var counted = false; try { counted = localStorage.getItem('rad-secret-counted') === '1'; } catch(e){}
  var box = document.getElementById('count');
  try {
    fetch(base + (counted ? 'get/' : 'hit/') + KEY)
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(d){
        document.getElementById('n').textContent = d.value;
        document.getElementById('t').textContent = d.value === 1 ? 'person has found this page, and it is you.' : 'people have found this page, you included.';
        box.hidden = false;
        if (!counted){ try { localStorage.setItem('rad-secret-counted', '1'); } catch(e){} }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>
</body>
</html>
