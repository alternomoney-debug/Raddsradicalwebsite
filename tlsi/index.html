<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Long Shot Initiative (Rad)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg: #0b0d11;
    --ink: #f1f3f5;
    --muted: #a7b0ba;
    --line: #252a31;
    --accent: #5b9be6;
    --font: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
    --max: 1480px;
    --gutter: clamp(20px, 4vw, 64px);
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  #c{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .page{ position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; }
  ::selection{ background: var(--accent); color: var(--bg); }
  a{ color: var(--ink); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap{ width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  .top{ display: flex; justify-content: space-between; align-items: center; padding-top: 26px; padding-bottom: 26px; }
  .top .mark{ font-weight: 800; font-size: 22px; letter-spacing: -0.03em; text-decoration: none; }
  .top .back{ color: var(--muted); text-decoration: none; font-weight: 500; }
  .top .back:hover{ color: var(--ink); }

  main{ flex: 1; padding-top: 6vh; padding-bottom: 8vh; }
  h1{
    margin: 0;
    font-size: clamp(56px, 11vw, 190px);
    font-weight: 800;
    line-height: 0.88;
    letter-spacing: -0.05em;
  }
  h1 .tlsi{ color: var(--accent); }
  .by{ margin: 24px 0 0; font-size: clamp(20px, 2vw, 28px); color: var(--muted); }
  .logline{
    margin: 56px 0 0;
    max-width: 30ch;
    font-size: clamp(28px, 3.6vw, 56px);
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  section.block{ margin-top: 96px; }
  h2{ margin: 0 0 28px; font-size: clamp(28px, 4vw, 48px); font-weight: 700; line-height: 1.05; letter-spacing: -0.025em; }

  .synopsis{ display: grid; grid-template-columns: 1.4fr 0.6fr; gap: clamp(32px, 5vw, 96px); align-items: start; }
  .synopsis p{ margin: 0 0 18px; max-width: 58ch; font-size: clamp(18px, 1.5vw, 22px); }
  .status{ font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .status small{ display: block; margin-bottom: 6px; font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--muted); }

  .rows{ border-top: 1px solid var(--line); }
  .row{
    display: grid;
    grid-template-columns: minmax(200px, 0.4fr) 1fr;
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid var(--line);
    align-items: baseline;
  }
  .row .t{ font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .row .d{ color: var(--muted); max-width: 56ch; }
  .row .d b{ color: var(--ink); font-weight: 600; }

  footer{ padding-top: 40px; padding-bottom: 60px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 32px; font-size: 14px; color: var(--muted); }

  @media (max-width: 860px){
    .synopsis{ grid-template-columns: 1fr; }
    .row{ grid-template-columns: 1fr; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="page">
  <div class="wrap top">
    <a class="mark" href="../">rad</a>
    <a class="back" href="../">Back to the main page</a>
  </div>

  <main class="wrap">
    <h1>The Long Shot <span class="tlsi">Initiative</span></h1>
    <p class="by">A book by Rad.</p>
    <p class="logline" id="logline" hidden></p>

    <section class="block" id="synopsis-block" hidden>
      <h2>What it's about</h2>
      <div class="synopsis">
        <div id="synopsis"></div>
        <div class="status" id="status" hidden><small>Where it's at</small><span id="status-text"></span></div>
      </div>
    </section>

    <section class="block" id="chars-block">
      <h2>Characters</h2>
      <div class="rows" id="chars"></div>
    </section>

    <section class="block" id="credits-block">
      <h2>Credits</h2>
      <div class="rows" id="credits"></div>
    </section>

    <section class="block" id="links-block" hidden>
      <h2>Read it</h2>
      <div class="rows" id="links"></div>
    </section>
  </main>

  <footer class="wrap">
    <span>The Long Shot Initiative, by Rad</span>
    <span>ASCII background by TheMonHub on Discord</span>
  </footer>
</div>

<script>
/*
  FILL THIS IN. Anything you leave empty ("" or []) just doesn't show up,
  so the page never has blank gaps.
*/
var TLSI = {
  logline: "",          // one or two sentences. This shows up huge under the title.
  status: "",           // like "Being written" or "Out now"
  synopsis: [],         // each line in quotes is one paragraph, like ["First paragraph.", "Second paragraph."]
  characters: [
    { name: "Jinzhou", role: "", voice: "textkat.x3" }
    // { name: "Name", role: "who they are, one line", voice: "voice actor, optional" },
  ],
  credits: [
    { role: "Written by", who: "Rad" },
    { role: "Edited by", who: "eshanthetrainlover" },
    { role: "Jinzhou voiced by", who: "textkat.x3" }
  ],
  links: [
    // { label: "Read chapter one", href: "https://..." },
  ]
};

(function(){
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  var d = TLSI;

  if (d.logline){ var l = document.getElementById('logline'); l.textContent = d.logline; l.hidden = false; }

  if ((d.synopsis && d.synopsis.length) || d.status){
    document.getElementById('synopsis-block').hidden = false;
    var box = document.getElementById('synopsis');
    (d.synopsis || []).forEach(function(p){ box.appendChild(el('p', '', p)); });
    if (d.status){ document.getElementById('status').hidden = false; document.getElementById('status-text').textContent = d.status; }
  }

  function rows(id, list, build){
    var host = document.getElementById(id);
    if (!list || !list.length){ host.parentElement.hidden = true; return; }
    list.forEach(function(item){ host.appendChild(build(item)); });
  }
  rows('chars', d.characters, function(c){
    var r = el('div', 'row'); r.appendChild(el('div', 't', c.name));
    var desc = el('div', 'd');
    if (c.role) desc.appendChild(document.createTextNode(c.role));
    if (c.voice){
      if (c.role) desc.appendChild(document.createElement('br'));
      desc.appendChild(document.createTextNode('Voiced by '));
      desc.appendChild(el('b', '', c.voice));
    }
    r.appendChild(desc); return r;
  });
  rows('credits', d.credits, function(c){
    var r = el('div', 'row'); r.appendChild(el('div', 't', c.role));
    var desc = el('div', 'd'); desc.appendChild(el('b', '', c.who)); r.appendChild(desc); return r;
  });
  rows('links', d.links, function(l){
    var r = el('div', 'row'); var t = el('div', 't');
    var a = el('a', '', l.label); a.href = l.href; a.target = '_blank'; a.rel = 'noopener'; t.appendChild(a);
    r.appendChild(t); r.appendChild(el('div', 'd')); return r;
  });
  if (d.links && d.links.length) document.getElementById('links-block').hidden = false;
})();
</script>

<script>
// Background animation generated using https://baptiste-schlienger.com/experiments/animatedascii/index.html
// Customized and integrated by TheMonHub; recolored to neutral grey with blue peaks
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var w, h, cols, rows, frame = 0;
  var SEED = crypto.getRandomValues(new Uint32Array(1))[0];

  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var settings = {
    noiseLevel: 0.013,
    speed: 0.6,
    fontSize: 13,
    colors: ["#0b0d11", "#111419", "#171b20", "#1e2329", "#272d35", "#333b45", "#434e5b", "#5b9be6", "#9cc4f2"],
    bgColor: "#0b0d11",
    charSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&{}[]()<>*+-=/"
  };

  var charGrid = [];
  function init(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.ceil(w / (settings.fontSize * 0.6));
    rows = Math.ceil(h / settings.fontSize);
    charGrid = [];
    for (let r = 0; r < rows; r++){
      let row = [];
      for (let c = 0; c < cols; c++) row.push(settings.charSet[Math.floor(rand() * settings.charSet.length)]);
      charGrid.push(row);
    }
  }

  var p = new Uint8Array(512);
  (function(){
    var perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 256; i++) p[i] = p[i + 256] = perm[i];
  })();

  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function lerp(t,a,b){ return a+t*(b-a); }
  function grad(h,x,y,z){
    const i=h&15, u=i<8?x:y, v=i<4?y:i==12||i==14?x:z;
    return((i&1)==0?u:-u)+((i&2)==0?v:-v);
  }
  function perlin(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), ww=fade(z);
    const A=p[X]+Y, AA=p[A]+Z, AB=p[A+1]+Z;
    const B=p[X+1]+Y, BA=p[B]+Z, BB=p[B+1]+Z;
    return lerp(ww,
      lerp(v, lerp(u,grad(p[AA],x,y,z),grad(p[BA],x-1,y,z)), lerp(u,grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z))),
      lerp(v, lerp(u,grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1)), lerp(u,grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1)))
    );
  }

  var mouse = { x: -1000, y: -1000 };
  window.addEventListener('pointermove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseout', function(e){ if (!e.relatedTarget) mouse.x = -1000; });

  var running = false, scrollY = 0;

  function draw(){
    ctx.fillStyle = settings.bgColor;
    ctx.fillRect(0,0,w,h);
    ctx.font = settings.fontSize + 'px monospace';
    const cw = settings.fontSize * 0.6;
    const zOff = (frame * 0.003 + scrollY * 0.002) * settings.speed;
    for (let r=0; r<rows; r++){
      for (let c=0; c<cols; c++){
        const x = c*cw, y = r*settings.fontSize;
        let n = perlin(c*settings.noiseLevel, r*settings.noiseLevel, zOff);
        if (mouse.x > -1000 && !reduce.matches){
          const d = Math.sqrt((x-mouse.x)**2 + (y-(mouse.y-settings.fontSize/2))**2);
          if (d < 150) n += (1 - d/150) * 0.8;
        }
        let ci = Math.floor(((n+1)/2) * settings.colors.length);
        ci = Math.max(0, Math.min(ci, settings.colors.length-1));
        ctx.fillStyle = settings.colors[ci];
        if (rand() < 0.05 * settings.speed) charGrid[r][c] = settings.charSet[Math.floor(rand()*settings.charSet.length)];
        ctx.fillText(charGrid[r][c], x, y);
      }
    }
    if (reduce.matches){ running = false; return; }
    frame++;
    requestAnimationFrame(draw);
  }
  function start(){ if (running) return; running = true; draw(); }

  function updateScroll(){
    const top = window.pageYOffset || document.documentElement.scrollTop;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? top / max : 0;
    scrollY = pct * 1500;
    canvas.style.opacity = Math.min(Math.max((1 - pct) / 2.5, 0.12), 0.4).toString();
    if (reduce.matches) draw();
  }

  window.addEventListener('scroll', updateScroll, { passive: true });
  window.addEventListener('resize', function(){ init(); reduce.matches ? draw() : start(); });
  init();
  updateScroll();
  start();
})();
</script>
</body>
</html>
