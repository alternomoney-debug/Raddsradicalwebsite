<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Long Shot Initiative (Rad)</title>
<meta name="description" content="The Long Shot Initiative is a book by Rad, currently being written.">
<meta name="theme-color" content="#0b0d11">
<meta property="og:type" content="website">
<meta property="og:title" content="The Long Shot Initiative">
<meta property="og:description" content="A book by Rad, currently being written.">
<meta property="og:url" content="https://raddwastaken.art/tlsi/">
<meta name="twitter:card" content="summary">
<!--
  WHEN THE COVER IS APPROVED, add these two lines so Discord and Bluesky show it in link previews
  (the link has to be the full address, and the file has to exist first):
  <meta property="og:image" content="https://raddwastaken.art/tlsi/assets/tlsi-cover.webp">
  and change the twitter:card line above to: <meta name="twitter:card" content="summary_large_image">
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg: #0b0d11;
    --ink: #f1f3f5;
    --muted: #a7b0ba;
    --line: #252a31;
    --accent: #5b9be6;
    --font: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
    --max: 2200px;
    --gutter: clamp(20px, 4vw, 64px);
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{ margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  #c{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .page{ position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; }
  ::selection{ background: var(--accent); color: var(--bg); }
  a{ color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  a:hover{ color: var(--accent); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap{ width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  .top{ display: flex; justify-content: space-between; align-items: center; padding-top: 26px; padding-bottom: 26px; }
  .top a{ text-decoration: none; }
  .top .mark{ font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
  .top .back{ color: var(--muted); font-weight: 500; }
  .top .back:hover{ color: var(--ink); }

  main{ flex: 1; padding-top: 6vh; padding-bottom: 8vh; }

  /* hero: text on the left, cover on the right once there is a cover */
  .hero{ display: block; }
  h1{
    margin: 0;
    font-size: clamp(56px, 11vw, 190px);
    font-weight: 800;
    line-height: 0.88;
    letter-spacing: -0.05em;
  }
  h1 .tlsi{ color: var(--accent); }
  .by{ margin: 24px 0 0; font-size: clamp(20px, 2vw, 28px); color: var(--muted); }
  .logline{ margin: 56px 0 0; max-width: 30ch; font-size: clamp(28px, 3.6vw, 56px); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }

  .cover{ margin: 0; }
  .cover img{ display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; object-position: left top; border-radius: var(--radius); }
  .cover figcaption{ margin-top: 12px; font-size: 14px; color: var(--muted); }

  .hero.has-cover{ display: grid; gap: 40px; }
  @media (min-width: 1000px){
    .hero.has-cover{ grid-template-columns: 1.5fr 1fr; gap: clamp(32px, 5vw, 96px); align-items: start; }
    .cover img{ object-position: right top; }
  }

  section.block{ margin-top: 96px; }
  h2{ margin: 0 0 28px; font-size: clamp(28px, 4vw, 48px); font-weight: 700; line-height: 1.05; letter-spacing: -0.025em; }

  .synopsis{ display: grid; grid-template-columns: 1.4fr 0.6fr; gap: clamp(32px, 5vw, 96px); align-items: start; }
  .synopsis p{ margin: 0 0 18px; max-width: 58ch; font-size: clamp(18px, 1.5vw, 22px); }
  .status{ font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .status small{ display: block; margin-bottom: 6px; font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--muted); }

  .rows{ border-top: 1px solid var(--line); }
  .row{ display: grid; grid-template-columns: minmax(200px, 0.4fr) 1fr; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .row .t{ font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .row .d{ color: var(--muted); max-width: 56ch; }
  .row .d b{ color: var(--ink); font-weight: 600; }
  .rows.small .row{ padding: 14px 0; }
  .rows.small .t{ font-size: clamp(20px, 1.8vw, 26px); }
  .rows.small .d{ color: var(--ink); font-size: clamp(18px, 1.6vw, 22px); }

  /* world cards */
  .cards{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card{ border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .card h3{ margin: 0 0 8px; font-size: clamp(22px, 2vw, 28px); font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
  .card p{ margin: 0; color: var(--muted); }

  /* gallery */
  .gallery{ display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .shot{ margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: zoom-in; }
  .shot img{ display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .shot span{ display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .shot:hover img{ border-color: var(--accent); }

  dialog{ max-width: min(92vw, 1400px); max-height: 92vh; padding: 0; border: 0; background: transparent; color: var(--ink); }
  dialog::backdrop{ background: rgba(5,6,8,0.88); }
  dialog img{ display: block; max-width: 100%; max-height: 80vh; margin: 0 auto; }
  dialog p{ margin: 12px 0 0; text-align: center; }
  dialog button{ position: fixed; top: 20px; right: 24px; background: none; border: 0; color: var(--ink); font: 600 16px var(--font); cursor: pointer; }

  .row .note{ color: var(--muted); }

  .ns{ margin: 40px 0 0; max-width: 50ch; font-size: 20px; }

  footer{ padding-top: 40px; padding-bottom: 60px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 32px; font-size: 14px; color: var(--muted); }

  @media (max-width: 1100px){ .cards{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 860px){
    .synopsis{ grid-template-columns: 1fr; }
    .row{ grid-template-columns: 1fr; gap: 6px; }
    .cards{ grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="page">
  <div class="wrap top">
    <a class="mark" href="../">rad</a>
    <a class="back" href="../">Back to the main page</a>
  </div>

  <main class="wrap">
    <div class="hero" id="hero">
      <div>
        <h1>The Long Shot <span class="tlsi">Initiative</span></h1>
        <p class="by">A book by Rad.</p>
        <p class="logline" id="logline" hidden></p>
      </div>
      <figure class="cover" id="cover" hidden></figure>
    </div>

    <noscript><p class="ns">The Long Shot Initiative is a book by Rad. The rest of this page needs JavaScript turned on to show up.</p></noscript>

    <section class="block" id="synopsis-block" hidden>
      <h2>What it's about</h2>
      <div class="synopsis">
        <div id="synopsis"></div>
        <div class="status" id="status" hidden><small>Where it's at</small><span id="status-text"></span></div>
      </div>
    </section>

    <section class="block" id="chars-block">
      <h2>Characters</h2>
      <div class="rows" id="chars"></div>
    </section>

    <section class="block" id="world-block" hidden>
      <h2>The world</h2>
      <div class="cards" id="world"></div>
    </section>

    <section class="block" id="pron-block" hidden>
      <h2>How to say things</h2>
      <div class="rows small" id="pron"></div>
    </section>

    <section class="block" id="gallery-block" hidden>
      <h2>Patches</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="block" id="credits-block">
      <h2>Credits</h2>
      <div class="rows" id="credits"></div>
    </section>

    <section class="block" id="links-block" hidden>
      <h2>Read it</h2>
      <div class="rows" id="links"></div>
    </section>
  </main>

  <footer class="wrap">
    <span>The Long Shot Initiative, by Rad</span>
    <span>ASCII background by TheMonHub on Discord</span>
  </footer>
</div>

<dialog id="lightbox">
  <button type="button" id="lb-close">Close</button>
  <img id="lb-img" alt="">
  <p id="lb-cap"></p>
</dialog>

<script>
/*
  FILL THIS IN. Anything left empty ("" or [] or removed) just doesn't show up,
  so the page never has blank gaps. Nothing is hard-coded in the HTML above.
*/
var TLSI = {
  // One or two sentences. Shows up huge under the title.
  logline: "",
  // Draft to approve or rewrite, then paste it between the quotes above:
  //   "Ethyn Vasek wakes on a ship 6.4 light years from home, with no memory, one other survivor, and a star that's being eaten."

  status: "Being written",

  // Each line in quotes is one paragraph, like ["First paragraph.", "Second paragraph."]
  synopsis: [],

  // Cover art. Leave src empty until the artist says yes and you have the credit name.
  // Put the image in a folder called "assets" next to this file.
  cover: {
    src: "",                 // like "assets/tlsi-cover.webp"
    alt: "",                 // describe the picture for people who can't see it
    credit: "",              // like "Cover art by their-handle"
    w: 0, h: 0               // the image's real pixel size (stops the page jumping while it loads)
  },

  characters: [
    { name: "Jinzhou", role: "", voice: "textkat.x3" },
    { name: "Ethyn", role: "", voice: "", status: "Casting" }
    // { name: "Name", role: "one line about who they are", voice: "voice actor", status: "shown only if there's no voice yet" },
  ],

  // Short blocks about the world: [{ title: "The Line", text: "one or two lines" }]
  world: [],

  // How to say the made-up words. Only confirmed ones go in.
  pronunciations: [
    { term: "Aluk'", say: "Ah-lok" }
    // { term: "Y'shari", say: "" }, { term: "Wask-ki", say: "" }, { term: "Nakuet", say: "" },
    // { term: "Phengoclept", say: "" }, { term: "ARACCSIM", say: "" },
  ],

  // Mission and crew patches: [{ src: "assets/patch-mission.png", alt: "what it shows", caption: "name of the patch", w: 600, h: 600 }]
  gallery: [],

  credits: [
    { role: "Written by", who: "Rad" },
    { role: "Edited by", who: "eshanthetrainlover" },
    { role: "Jinzhou voiced by", who: "textkat.x3" }
    // { role: "Cover art", who: "their-handle" },
    // { role: "ARACCSIM voiced by", who: "name" },
  ],

  // Where to read or listen: [{ label: "Chapter one", href: "https://...", note: "Coming soon" }]
  links: []
};

(function(){
  var d = TLSI;
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function sized(img, w, h){ if (w) img.width = w; if (h) img.height = h; }

  // logline
  if (d.logline){ var l = document.getElementById('logline'); l.textContent = d.logline; l.hidden = false; }

  // cover
  if (d.cover && d.cover.src){
    var fig = document.getElementById('cover');
    var img = el('img'); img.src = d.cover.src; img.alt = d.cover.alt || ''; img.setAttribute('loading', 'eager'); sized(img, d.cover.w, d.cover.h);
    fig.appendChild(img);
    if (d.cover.credit) fig.appendChild(el('figcaption', '', d.cover.credit));
    fig.hidden = false;
    document.getElementById('hero').classList.add('has-cover');
  }

  // synopsis + status
  if ((d.synopsis && d.synopsis.length) || d.status){
    document.getElementById('synopsis-block').hidden = false;
    var box = document.getElementById('synopsis');
    (d.synopsis || []).forEach(function(p){ box.appendChild(el('p', '', p)); });
    if (d.status){ document.getElementById('status').hidden = false; document.getElementById('status-text').textContent = d.status; }
  }

  // rows-style sections hide themselves when empty
  function rows(id, list, build){
    var host = document.getElementById(id);
    var section = host.closest('section');
    if (!list || !list.length){ section.hidden = true; return; }
    list.forEach(function(item){ host.appendChild(build(item)); });
    section.hidden = false;
  }

  rows('chars', d.characters, function(c){
    var r = el('div', 'row'); r.appendChild(el('div', 't', c.name));
    var desc = el('div', 'd');
    if (c.role) desc.appendChild(document.createTextNode(c.role));
    if (c.voice){
      if (c.role) desc.appendChild(document.createElement('br'));
      desc.appendChild(document.createTextNode('Voiced by '));
      desc.appendChild(el('b', '', c.voice));
    } else if (c.status){
      if (c.role) desc.appendChild(document.createElement('br'));
      desc.appendChild(el('b', '', c.status));
    }
    r.appendChild(desc); return r;
  });

  rows('world', d.world, function(w){
    var c = el('div', 'card'); c.appendChild(el('h3', '', w.title)); c.appendChild(el('p', '', w.text)); return c;
  });

  rows('pron', d.pronunciations, function(p){
    var r = el('div', 'row'); r.appendChild(el('div', 't', p.term)); r.appendChild(el('div', 'd', p.say)); return r;
  });

  // gallery with a lightbox
  var lb = document.getElementById('lightbox');
  rows('gallery', d.gallery, function(g){
    var b = el('button', 'shot'); b.type = 'button';
    var im = el('img'); im.src = g.src; im.alt = g.alt || g.caption || ''; im.setAttribute('loading', 'lazy'); sized(im, g.w, g.h);
    b.appendChild(im);
    if (g.caption) b.appendChild(el('span', '', g.caption));
    b.addEventListener('click', function(){
      document.getElementById('lb-img').src = g.src;
      document.getElementById('lb-img').alt = g.alt || g.caption || '';
      document.getElementById('lb-cap').textContent = g.caption || '';
      lb.showModal();
    });
    return b;
  });
  document.getElementById('lb-close').addEventListener('click', function(){ lb.close(); });
  lb.addEventListener('click', function(e){ if (e.target === lb) lb.close(); });

  rows('credits', d.credits, function(c){
    var r = el('div', 'row'); r.appendChild(el('div', 't', c.role));
    var desc = el('div', 'd'); desc.appendChild(el('b', '', c.who)); r.appendChild(desc); return r;
  });

  rows('links', d.links, function(l){
    var r = el('div', 'row'); var t = el('div', 't');
    var a = el('a', '', l.label); a.href = l.href; a.target = '_blank'; a.rel = 'noopener'; t.appendChild(a);
    r.appendChild(t); r.appendChild(el('div', 'd note', l.note || '')); return r;
  });
})();
</script>

<script>
// Background animation generated using https://baptiste-schlienger.com/experiments/animatedascii/index.html
// Customized and integrated by TheMonHub; recolored to neutral grey with blue peaks
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var w, h, cols, rows, frame = 0;
  var SEED = crypto.getRandomValues(new Uint32Array(1))[0];

  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var settings = {
    noiseLevel: 0.013,
    speed: 0.6,
    fontSize: 13,
    colors: ["#0b0d11", "#111419", "#171b20", "#1e2329", "#272d35", "#333b45", "#434e5b", "#5b9be6", "#9cc4f2"],
    bgColor: "#0b0d11",
    charSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&{}[]()<>*+-=/"
  };

  var charGrid = [];
  function init(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.ceil(w / (settings.fontSize * 0.6));
    rows = Math.ceil(h / settings.fontSize);
    charGrid = [];
    for (let r = 0; r < rows; r++){
      let row = [];
      for (let c = 0; c < cols; c++) row.push(settings.charSet[Math.floor(rand() * settings.charSet.length)]);
      charGrid.push(row);
    }
  }

  var p = new Uint8Array(512);
  (function(){
    var perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 256; i++) p[i] = p[i + 256] = perm[i];
  })();

  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function lerp(t,a,b){ return a+t*(b-a); }
  function grad(h,x,y,z){
    const i=h&15, u=i<8?x:y, v=i<4?y:i==12||i==14?x:z;
    return((i&1)==0?u:-u)+((i&2)==0?v:-v);
  }
  function perlin(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), ww=fade(z);
    const A=p[X]+Y, AA=p[A]+Z, AB=p[A+1]+Z;
    const B=p[X+1]+Y, BA=p[B]+Z, BB=p[B+1]+Z;
    return lerp(ww,
      lerp(v, lerp(u,grad(p[AA],x,y,z),grad(p[BA],x-1,y,z)), lerp(u,grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z))),
      lerp(v, lerp(u,grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1)), lerp(u,grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1)))
    );
  }

  var mouse = { x: -1000, y: -1000 };
  window.addEventListener('pointermove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseout', function(e){ if (!e.relatedTarget) mouse.x = -1000; });

  var running = false, scrollY = 0;

  function draw(){
    ctx.fillStyle = settings.bgColor;
    ctx.fillRect(0,0,w,h);
    ctx.font = settings.fontSize + 'px monospace';
    const cw = settings.fontSize * 0.6;
    const zOff = (frame * 0.003 + scrollY * 0.002) * settings.speed;
    for (let r=0; r<rows; r++){
      for (let c=0; c<cols; c++){
        const x = c*cw, y = r*settings.fontSize;
        let n = perlin(c*settings.noiseLevel, r*settings.noiseLevel, zOff);
        if (mouse.x > -1000 && !reduce.matches){
          const d = Math.sqrt((x-mouse.x)**2 + (y-(mouse.y-settings.fontSize/2))**2);
          if (d < 150) n += (1 - d/150) * 0.8;
        }
        let ci = Math.floor(((n+1)/2) * settings.colors.length);
        ci = Math.max(0, Math.min(ci, settings.colors.length-1));
        ctx.fillStyle = settings.colors[ci];
        if (rand() < 0.05 * settings.speed) charGrid[r][c] = settings.charSet[Math.floor(rand()*settings.charSet.length)];
        ctx.fillText(charGrid[r][c], x, y);
      }
    }
    if (reduce.matches){ running = false; return; }
    frame++;
    requestAnimationFrame(draw);
  }
  function start(){ if (running) return; running = true; draw(); }

  function updateScroll(){
    const top = window.pageYOffset || document.documentElement.scrollTop;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? top / max : 0;
    scrollY = pct * 1500;
    canvas.style.opacity = Math.min(Math.max((1 - pct) / 2.5, 0.12), 0.4).toString();
    if (reduce.matches) draw();
  }

  window.addEventListener('scroll', updateScroll, { passive: true });
  window.addEventListener('resize', function(){ init(); reduce.matches ? draw() : start(); });
  init();
  updateScroll();
  start();
})();
</script>
</body>
</html>
