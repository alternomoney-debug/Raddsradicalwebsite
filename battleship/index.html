<style>
  :root{
    color-scheme: dark;
    --bg: #0b0d11;
    --bg-alt: #14171c;
    --ink: #f1f3f5;
    --muted: #a7b0ba;
    --line: #252a31;
    --accent: #5b9be6;
    --water: #101722;
    --ship: #4a5563;
    --hit: #e5533f;
    --miss: #3a4452;
    --sunk: #7d2a20;
    --font: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
    --max: 1480px;
    --gutter: clamp(16px, 4vw, 64px);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--ink); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  .top{ display: flex; justify-content: space-between; align-items: center; padding-top: 22px; padding-bottom: 22px; }
  .top .mark{ font-weight: 800; font-size: 22px; letter-spacing: -0.03em; text-decoration: none; }
  .top .back{ color: var(--muted); text-decoration: none; font-weight: 500; }
  .top .back:hover{ color: var(--ink); }

  h1{
    margin: 0;
    font-size: clamp(56px, 10vw, 160px);
    font-weight: 800;
    line-height: 0.85;
    letter-spacing: -0.05em;
  }

  /* mode bar */
  .modes{ display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 0; }
  button{
    font: 700 16px var(--font);
    color: var(--ink);
    background: var(--bg-alt);
    border: 1px solid var(--line);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  button:hover:not(:disabled){ border-color: var(--accent); }
  button.on{ background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.go{ background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .online{ display: none; margin-top: 18px; gap: 10px; flex-wrap: wrap; align-items: center; }
  .online.show{ display: flex; }
  .online input{
    font: 700 18px var(--font);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    width: 8ch;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .code{
    font-size: clamp(28px, 3vw, 40px);
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  .online .hint{ color: var(--muted); }

  .status{
    margin: 32px 0 20px;
    min-height: 1.2em;
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .status.win{ color: var(--accent); }
  .status.lose{ color: var(--hit); }

  /* boards */
  .boards{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(20px, 4vw, 64px);
    align-items: start;
  }
  .side h2{
    margin: 0 0 10px;
    font-size: clamp(20px, 2vw, 28px);
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .side h2 small{ font-size: 15px; font-weight: 400; color: var(--muted); }

  .grid{
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    width: 100%;
    max-width: 640px;
    user-select: none;
    touch-action: manipulation;
  }
  .cell{
    aspect-ratio: 1;
    background: var(--water);
    border: 0;
    padding: 0;
    border-radius: 3px;
    position: relative;
  }
  .grid.target .cell{ cursor: crosshair; }
  .grid.target .cell:hover:not(.miss):not(.hit):not(.sunk){ background: #1a2638; }
  .grid.placing .cell{ cursor: pointer; }
  .cell.ship{ background: var(--ship); }
  .cell.preview{ background: rgba(91,155,230,0.45); }
  .cell.preview.bad{ background: rgba(229,83,63,0.45); }
  .cell.miss::after{
    content: '';
    position: absolute;
    inset: 38%;
    border-radius: 50%;
    background: var(--miss);
  }
  .cell.hit{ background: var(--hit); }
  .cell.sunk{ background: var(--sunk); }
  .cell.hit::after, .cell.sunk::after{
    content: '';
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }
  .cell.reveal{ background: var(--ship); opacity: 0.6; }
  .cell.last{ box-shadow: inset 0 0 0 2px var(--ink); }

  .fleet{ margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); }
  .fleet li.dead{ text-decoration: line-through; opacity: 0.5; }
  .fleet li.cur{ color: var(--accent); font-weight: 700; }

  .setup{ display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

  .topright{ display: flex; align-items: center; gap: 20px; }
  .ra-btn{ font: 700 15px var(--font); }

  .lb{ margin-top: 80px; }
  .lb h2{ margin: 0 0 16px; font-size: clamp(28px, 4vw, 48px); font-weight: 700; line-height: 1.05; letter-spacing: -0.025em; }
  .lbnote{ margin: 14px 0 0; color: var(--muted); min-height: 1.4em; }
  .lbrows{ list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--line); max-width: 760px; }
  .lbrows li{ display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .lbrows .rank{ color: var(--muted); font-weight: 700; }
  .lbrows .who{ font-size: clamp(20px, 2vw, 28px); font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .lbrows .rec{ color: var(--muted); white-space: nowrap; }
  .lbrows .who a{ color: inherit; text-decoration: none; }
  .lbrows .who a:hover{ color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
  #lb .modes + .modes{ margin-top: 10px; }
  .lbrows li.me .who{ color: var(--accent); }

  footer{ padding-top: 60px; padding-bottom: 40px; color: var(--muted); font-size: 14px; }

  @media (max-width: 820px){
    .boards{ grid-template-columns: 1fr; }
    .side.enemy{ order: -1; }
  }
</style>
</head>
<body>
  <div class="wrap top">
    <a class="mark" href="../">rad</a>
    <div class="topright">
      <a class="back" href="../games/">All games</a>
      <a class="back" href="../elsewhere/">Back to elsewhere</a>
      <span id="acct"></span>
    </div>
  </div>

  <main class="wrap">
    <h1>Battleship</h1>

    <div class="modes">
      <button type="button" id="mode-bot" class="on">Vs bot</button>
      <button type="button" id="mode-online">Vs a friend (online)</button>
    </div>

    <div class="online" id="online">
      <button type="button" id="host">Make a room</button>
      <span class="hint">or</span>
      <input id="join-code" maxlength="5" placeholder="CODE" aria-label="Room code">
      <button type="button" id="join">Join</button>
      <span class="code" id="room-code"></span>
      <span class="hint" id="room-hint"></span>
    </div>

    <p class="status" id="status"></p>

    <div class="boards">
      <section class="side mine">
        <h2>Your waters <small id="my-sub"></small></h2>
        <div class="grid" id="my-grid"></div>
        <ul class="fleet" id="my-fleet"></ul>
        <div class="setup" id="setup">
          <button type="button" id="rotate">Rotate (R)</button>
          <button type="button" id="random">Random</button>
          <button type="button" id="clear">Clear</button>
          <button type="button" id="start" class="go" disabled>Start</button>
        </div>
      </section>
      <section class="side enemy">
        <h2><span id="enemy-name">Bot's waters</span> <small id="enemy-sub"></small></h2>
        <div class="grid" id="enemy-grid"></div>
        <ul class="fleet" id="enemy-fleet"></ul>
        <div class="setup">
          <button type="button" id="again" class="go" hidden>Play again</button>
        </div>
      </section>
    </div>

    <section class="lb" id="lb" hidden>
      <h2>Leaderboard</h2>
      <div class="modes">
        <button type="button" id="lb-bot" class="on">Vs bot</button>
        <button type="button" id="lb-online">Vs a friend</button>
      </div>
      <div class="modes">
        <button type="button" id="sort-wins" class="on">Most wins</button>
        <button type="button" id="sort-streak">Best streak</button>
        <button type="button" id="sort-shots">Fewest shots</button>
      </div>
      <p class="lbnote" id="lbnote"></p>
      <ol class="lbrows" id="lbrows"></ol>
    </section>
  </main>

  <footer class="wrap">Made by Rad. Sink 'em.</footer>

<script src="../config.js"></script>
<script src="../auth.js"></script>
<script>
(function(){
  var N = 10;
  var SHIPS = [
    { name: 'Carrier', len: 5 },
    { name: 'Battleship', len: 4 },
    { name: 'Cruiser', len: 3 },
    { name: 'Submarine', len: 3 },
    { name: 'Destroyer', len: 2 }
  ];

  // ---------- board helpers ----------
  function newBoard(){
    var grid = [];
    for (var r = 0; r < N; r++){ grid.push(new Array(N).fill(-1)); }
    return { grid: grid, ships: [], shots: {} };
  }
  function cellsFor(r, c, len, horiz){
    var out = [];
    for (var i = 0; i < len; i++) out.push(horiz ? [r, c + i] : [r + i, c]);
    return out;
  }
  function canPlace(board, r, c, len, horiz){
    return cellsFor(r, c, len, horiz).every(function(p){
      return p[0] >= 0 && p[0] < N && p[1] >= 0 && p[1] < N && board.grid[p[0]][p[1]] === -1;
    });
  }
  function place(board, def, r, c, horiz){
    var cells = cellsFor(r, c, def.len, horiz);
    var idx = board.ships.length;
    board.ships.push({ name: def.name, len: def.len, cells: cells, hits: 0 });
    cells.forEach(function(p){ board.grid[p[0]][p[1]] = idx; });
  }
  function randomBoard(){
    var b = newBoard();
    SHIPS.forEach(function(def){
      var ok = false;
      while (!ok){
        var horiz = Math.random() < 0.5;
        var r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N);
        if (canPlace(b, r, c, def.len, horiz)){ place(b, def, r, c, horiz); ok = true; }
      }
    });
    return b;
  }
  // resolve a shot on a board. returns { hit, sunk: name|null, cells, allSunk }
  function receive(board, r, c){
    board.shots[r + ',' + c] = true;
    var idx = board.grid[r][c];
    if (idx === -1) return { hit: false, sunk: null, cells: null, allSunk: false };
    var ship = board.ships[idx];
    ship.hits++;
    var sunk = ship.hits >= ship.len;
    var allSunk = board.ships.every(function(s){ return s.hits >= s.len; });
    return { hit: true, sunk: sunk ? ship.name : null, cells: sunk ? ship.cells : null, allSunk: allSunk };
  }

  // ---------- state ----------
  var myShots = 0;
  var mode = 'bot';           // 'bot' | 'online'
  var phase = 'setup';        // 'setup' | 'waiting' | 'play' | 'over'
  var mine, enemyView, enemySunk, botBoard, myTurn, horiz = true, hover = null, lastMine = null, lastEnemy = null;
  var net = { peer: null, conn: null, host: false, meReady: false, themReady: false };

  var $ = function(id){ return document.getElementById(id); };
  var myGridEl = $('my-grid'), enemyGridEl = $('enemy-grid');

  function setStatus(t, cls){ var s = $('status'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }

  // build cells once
  function buildGrid(el, onClick, onHover){
    el.innerHTML = '';
    for (var r = 0; r < N; r++){
      for (var c = 0; c < N; c++){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cell';
        b.dataset.r = r; b.dataset.c = c;
        b.setAttribute('aria-label', 'Row ' + (r + 1) + ' column ' + (c + 1));
        el.appendChild(b);
      }
    }
    el.addEventListener('click', function(e){
      var t = e.target.closest('.cell'); if (!t) return;
      onClick(+t.dataset.r, +t.dataset.c);
    });
    if (onHover){
      el.addEventListener('pointerover', function(e){
        var t = e.target.closest('.cell'); if (!t) return;
        onHover(+t.dataset.r, +t.dataset.c);
      });
      el.addEventListener('pointerleave', function(){ onHover(null); });
    }
  }
  function cellEl(el, r, c){ return el.children[r * N + c]; }

  function reset(){
    mine = newBoard();
    enemyView = [];
    for (var r = 0; r < N; r++) enemyView.push(new Array(N).fill(0)); // 0 unknown, 1 miss, 2 hit, 3 sunk
    enemySunk = [];
    botBoard = null;
    lastMine = lastEnemy = null;
    myShots = 0;
    phase = 'setup';
    net.meReady = net.themReady = false;
    $('again').hidden = true;
    $('setup').style.display = '';
    bot.reset();
  }

  // ---------- render ----------
  function render(){
    // my board
    var placing = phase === 'setup' && mine.ships.length < SHIPS.length;
    var prev = [], prevBad = false;
    if (placing && hover){
      var def = SHIPS[mine.ships.length];
      prev = cellsFor(hover[0], hover[1], def.len, horiz);
      prevBad = !canPlace(mine, hover[0], hover[1], def.len, horiz);
    }
    for (var r = 0; r < N; r++){
      for (var c = 0; c < N; c++){
        var el = cellEl(myGridEl, r, c), cls = 'cell';
        var idx = mine.grid[r][c], shot = mine.shots[r + ',' + c];
        if (idx !== -1) cls += ' ship';
        if (shot){
          if (idx === -1) cls += ' miss';
          else cls += (mine.ships[idx].hits >= mine.ships[idx].len) ? ' sunk' : ' hit';
        }
        if (lastMine && lastMine[0] === r && lastMine[1] === c) cls += ' last';
        el.className = cls;
      }
    }
    prev.forEach(function(p){
      if (p[0] < N && p[1] < N){ var e = cellEl(myGridEl, p[0], p[1]); e.classList.add('preview'); if (prevBad) e.classList.add('bad'); }
    });
    myGridEl.classList.toggle('placing', placing);

    // enemy board
    for (r = 0; r < N; r++){
      for (c = 0; c < N; c++){
        var v = enemyView[r][c], ec = 'cell';
        if (v === 1) ec += ' miss'; else if (v === 2) ec += ' hit'; else if (v === 3) ec += ' sunk'; else if (v === 4) ec += ' reveal';
        if (lastEnemy && lastEnemy[0] === r && lastEnemy[1] === c) ec += ' last';
        cellEl(enemyGridEl, r, c).className = ec;
      }
    }
    enemyGridEl.classList.toggle('target', phase === 'play' && myTurn);

    // fleets
    $('my-fleet').innerHTML = SHIPS.map(function(d, i){
      var s = mine.ships[i], cls = '';
      if (s && s.hits >= s.len) cls = 'dead';
      else if (phase === 'setup' && i === mine.ships.length) cls = 'cur';
      return '<li class="' + cls + '">' + d.name + ' (' + d.len + ')</li>';
    }).join('');
    $('enemy-fleet').innerHTML = SHIPS.map(function(d){
      return '<li class="' + (enemySunk.indexOf(d.name) !== -1 ? 'dead' : '') + '">' + d.name + ' (' + d.len + ')</li>';
    }).join('');

    $('start').disabled = mine.ships.length < SHIPS.length || (mode === 'online' && (!net.conn || net.meReady));
    $('start').textContent = mode === 'online' ? (net.meReady ? 'Ready!' : 'Ready') : 'Start';
    $('my-sub').textContent = phase === 'setup' ? (placing ? 'Place your ' + SHIPS[mine.ships.length].name : 'All placed') : '';
    $('enemy-name').textContent = mode === 'bot' ? "Bot's waters" : "Friend's waters";
  }

  // ---------- setup interactions ----------
  function onMyClick(r, c){
    if (phase !== 'setup' || mine.ships.length >= SHIPS.length) return;
    var def = SHIPS[mine.ships.length];
    if (!canPlace(mine, r, c, def.len, horiz)) return;
    place(mine, def, r, c, horiz);
    render();
  }
  function onMyHover(r, c){ hover = r === null ? null : [r, c]; if (phase === 'setup') render(); }
  function rotate(){ horiz = !horiz; render(); }

  $('rotate').addEventListener('click', rotate);
  document.addEventListener('keydown', function(e){
    if ((e.key === 'r' || e.key === 'R') && document.activeElement.tagName !== 'INPUT') rotate();
  });
  $('random').addEventListener('click', function(){ if (phase !== 'setup' || net.meReady) return; mine = randomBoard(); render(); });
  $('clear').addEventListener('click', function(){ if (phase !== 'setup' || net.meReady) return; mine = newBoard(); render(); });
  $('start').addEventListener('click', function(){
    if (mine.ships.length < SHIPS.length) return;
    if (mode === 'bot'){ startBot(); }
    else { net.meReady = true; send({ t: 'ready' }); maybeStartOnline(); render(); }
  });
  $('again').addEventListener('click', function(){
    if (mode === 'online'){ if (!net.conn) return; send({ t: 'rematch' }); }
    reset(); render();
    setStatus(mode === 'bot' ? 'Place your ships.' : 'Rematch! Place your ships.');
  });

  // ---------- shooting ----------
  function onEnemyClick(r, c){
    if (phase !== 'play' || !myTurn || enemyView[r][c] !== 0) return;
    if (mode === 'bot'){
      var res = receive(botBoard, r, c);
      applyMyShot(r, c, res);
      if (phase === 'play'){ myTurn = false; render(); setTimeout(botTurn, 650); }
    } else {
      myTurn = false;
      send({ t: 'shot', r: r, c: c });
      setStatus('Firing...');
      render();
    }
  }
  function applyMyShot(r, c, res){
    myShots++;
    lastEnemy = [r, c];
    if (!res.hit){ enemyView[r][c] = 1; setStatus('Miss.'); }
    else if (res.sunk){
      res.cells.forEach(function(p){ enemyView[p[0]][p[1]] = 3; });
      enemySunk.push(res.sunk);
      setStatus('You sunk their ' + res.sunk + '!');
    } else { enemyView[r][c] = 2; setStatus('Hit!'); }
    if (res.allSunk){ end(true); }
    render();
  }
  function applyTheirShot(r, c){
    var res = receive(mine, r, c);
    lastMine = [r, c];
    var who = mode === 'bot' ? 'The bot' : 'Your friend';
    if (!res.hit) setStatus(who + ' missed. Your turn.');
    else if (res.sunk) setStatus(who + ' sunk your ' + res.sunk + '! Your turn.');
    else setStatus(who + ' hit you. Your turn.');
    if (res.allSunk) end(false);
    else myTurn = true;
    render();
    return res;
  }
  function end(won){
    phase = 'over';
    myTurn = false;
    setStatus(won ? 'You win! Whole fleet down.' : (mode === 'bot' ? 'The bot wins. Rough.' : 'Your friend wins. Rough.'), won ? 'win' : 'lose');
    $('again').hidden = false;
    if (window.RadAuth && RadAuth.enabled){
      var gameKey = mode === 'bot' ? 'battleship-bot' : 'battleship-online';
      if (RadAuth.user && RadAuth.profile){
        Promise.resolve(RadAuth.recordResult(gameKey, won, won ? myShots : null)).then(function(){ if (window.refreshLeaderboard) window.refreshLeaderboard(gameKey); });
      } else {
        var n = document.getElementById('lbnote'); if (n) n.textContent = 'Sign in to put your wins on the leaderboard.';
      }
    }
    // show where the bot's ships were hiding
    if (!won && mode === 'bot'){
      botBoard.ships.forEach(function(s){ s.cells.forEach(function(p){ if (enemyView[p[0]][p[1]] === 0) enemyView[p[0]][p[1]] = 4; }); });
    }
  }

  // ---------- bot ----------
  var bot = {
    shots: null, open: [],
    reset: function(){
      this.shots = [];
      for (var r = 0; r < N; r++) this.shots.push(new Array(N).fill(false));
      this.open = []; // hit cells on ships not yet sunk
    },
    pick: function(){
      var self = this;
      function free(r, c){ return r >= 0 && r < N && c >= 0 && c < N && !self.shots[r][c]; }
      // target mode: extend a line if 2+ hits line up, otherwise try neighbors
      if (this.open.length){
        if (this.open.length >= 2){
          var rows = this.open.map(function(p){ return p[0]; }), cols = this.open.map(function(p){ return p[1]; });
          var sameRow = rows.every(function(x){ return x === rows[0]; });
          var sameCol = cols.every(function(x){ return x === cols[0]; });
          var opts = [];
          if (sameRow){
            var lo = Math.min.apply(null, cols), hi = Math.max.apply(null, cols);
            if (free(rows[0], lo - 1)) opts.push([rows[0], lo - 1]);
            if (free(rows[0], hi + 1)) opts.push([rows[0], hi + 1]);
          } else if (sameCol){
            var lo2 = Math.min.apply(null, rows), hi2 = Math.max.apply(null, rows);
            if (free(lo2 - 1, cols[0])) opts.push([lo2 - 1, cols[0]]);
            if (free(hi2 + 1, cols[0])) opts.push([hi2 + 1, cols[0]]);
          }
          if (opts.length) return opts[Math.floor(Math.random() * opts.length)];
        }
        var nb = [];
        this.open.forEach(function(p){
          [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
            if (free(p[0] + d[0], p[1] + d[1])) nb.push([p[0] + d[0], p[1] + d[1]]);
          });
        });
        if (nb.length) return nb[Math.floor(Math.random() * nb.length)];
      }
      // hunt mode: checkerboard pattern, since every ship is at least 2 long
      var cand = [], any = [];
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){
        if (!this.shots[r][c]){ any.push([r, c]); if ((r + c) % 2 === 0) cand.push([r, c]); }
      }
      var list = cand.length ? cand : any;
      return list[Math.floor(Math.random() * list.length)];
    },
    learn: function(r, c, res){
      this.shots[r][c] = true;
      if (res.hit) this.open.push([r, c]);
      if (res.sunk){
        var gone = res.cells.map(function(p){ return p[0] + ',' + p[1]; });
        this.open = this.open.filter(function(p){ return gone.indexOf(p[0] + ',' + p[1]) === -1; });
      }
    }
  };
  function startBot(){
    botBoard = randomBoard();
    phase = 'play';
    myTurn = true;
    $('setup').style.display = 'none';
    setStatus('Your turn. Click their waters to fire.');
    render();
  }
  function botTurn(){
    if (phase !== 'play') return;
    var p = bot.pick();
    var res = applyTheirShot(p[0], p[1]);
    bot.learn(p[0], p[1], res);
  }

  // ---------- online (PeerJS, browser to browser) ----------
  var PREFIX = 'raddwastaken-bs-';
  function makeCode(){
    var a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  function send(msg){ if (net.conn && net.conn.open) net.conn.send(msg); }
  function closeNet(){
    try { if (net.conn) net.conn.close(); } catch(e){}
    try { if (net.peer) net.peer.destroy(); } catch(e){}
    net.peer = net.conn = null;
  }
  function hookConn(conn){
    net.conn = conn;
    conn.on('open', function(){
      $('room-hint').textContent = 'Connected!';
      reset(); render();
      setStatus('Friend connected. Place your ships, then hit Ready.');
    });
    conn.on('data', onData);
    conn.on('close', function(){
      net.conn = null;
      if (phase !== 'over') setStatus('Your friend left.', 'lose');
      $('room-hint').textContent = 'Disconnected.';
      phase = 'over';
      render();
    });
  }
  function onData(m){
    if (!m || !m.t) return;
    if (m.t === 'ready'){ net.themReady = true; maybeStartOnline(); render(); }
    else if (m.t === 'shot'){
      if (phase !== 'play') return;
      var res = applyTheirShot(m.r, m.c);
      send({ t: 'result', r: m.r, c: m.c, hit: res.hit, sunk: res.sunk, cells: res.cells, allSunk: res.allSunk });
    }
    else if (m.t === 'result'){ applyMyShot(m.r, m.c, m); }
    else if (m.t === 'rematch'){ reset(); render(); setStatus('Rematch! Place your ships.'); }
  }
  function maybeStartOnline(){
    if (!net.meReady){ return; }
    if (!net.themReady){ phase = 'waiting'; setStatus('Waiting for your friend to be ready...'); return; }
    phase = 'play';
    $('setup').style.display = 'none';
    myTurn = net.host; // host shoots first
    setStatus(myTurn ? 'Your turn. Click their waters to fire.' : 'They go first. Brace.');
  }
  function noPeer(){
    if (typeof Peer === 'undefined'){ setStatus('Online play could not load. Check your connection and refresh.', 'lose'); return true; }
    return false;
  }
  function hostRoom(){
    if (noPeer()) return;
    closeNet();
    net.host = true;
    var code = makeCode();
    net.peer = new Peer(PREFIX + code);
    $('room-code').textContent = '';
    $('room-hint').textContent = 'Making a room...';
    net.peer.on('open', function(){
      $('room-code').textContent = code;
      $('room-hint').textContent = 'Send this code to your friend.';
      setStatus('Waiting for your friend to join...');
    });
    net.peer.on('connection', function(conn){
      if (net.conn){ conn.close(); return; } // room is full
      hookConn(conn);
    });
    net.peer.on('error', function(err){
      if (err.type === 'unavailable-id') hostRoom();
      else $('room-hint').textContent = 'Something broke (' + err.type + '). Try again.';
    });
  }
  function joinRoom(){
    if (noPeer()) return;
    var code = $('join-code').value.trim().toUpperCase();
    if (code.length < 5){ $('room-hint').textContent = 'Codes are 5 characters.'; return; }
    closeNet();
    net.host = false;
    $('room-code').textContent = '';
    $('room-hint').textContent = 'Joining...';
    net.peer = new Peer();
    net.peer.on('open', function(){ hookConn(net.peer.connect(PREFIX + code, { reliable: true })); });
    net.peer.on('error', function(err){
      $('room-hint').textContent = err.type === 'peer-unavailable' ? "Couldn't find that room. Check the code." : 'Something broke (' + err.type + '). Try again.';
    });
  }
  $('host').addEventListener('click', hostRoom);
  $('join').addEventListener('click', joinRoom);
  $('join-code').addEventListener('keydown', function(e){ if (e.key === 'Enter') joinRoom(); });

  // ---------- mode switch ----------
  function setMode(m){
    mode = m;
    $('mode-bot').classList.toggle('on', m === 'bot');
    $('mode-online').classList.toggle('on', m === 'online');
    $('online').classList.toggle('show', m === 'online');
    if (m === 'bot'){ closeNet(); $('room-code').textContent = ''; $('room-hint').textContent = ''; }
    reset(); render();
    setStatus(m === 'bot' ? 'Place your ships. Click to place, R to rotate.' : 'Make a room and send the code, or join with a code.');
  }
  $('mode-bot').addEventListener('click', function(){ setMode('bot'); });
  $('mode-online').addEventListener('click', function(){ setMode('online'); });

  buildGrid(myGridEl, onMyClick, onMyHover);
  buildGrid(enemyGridEl, onEnemyClick, null);
  setMode('bot');
})();
</script>
<script>
(function(){
  if (!window.RadAuth) return;
  var current = 'battleship-bot', sort = 'wins';
  var $ = function(id){ return document.getElementById(id); };

  function recordText(r){
    if (sort === 'streak') return 'best streak ' + (r.best_streak || 0);
    if (sort === 'shots') return 'won in ' + r.best_shots + ' shots';
    return r.wins + ' won, ' + r.losses + ' lost';
  }
  function draw(rows){
    var ol = $('lbrows'); ol.innerHTML = '';
    if (!rows.length){ var li = document.createElement('li'); li.textContent = 'Nobody on this board yet. Be the first.'; li.style.gridTemplateColumns = '1fr'; ol.appendChild(li); return; }
    rows.forEach(function(r, i){
      var li = document.createElement('li');
      var name = (r.profiles && r.profiles.username) || 'someone';
      if (RadAuth.profile && name === RadAuth.profile.username) li.className = 'me';
      var a = document.createElement('span'); a.className = 'rank'; a.textContent = '#' + (i + 1);
      var b = document.createElement('span'); b.className = 'who';
      var link = document.createElement('a'); link.href = RadAuth.profileUrl(name); link.textContent = name; b.appendChild(link);
      var c = document.createElement('span'); c.className = 'rec'; c.textContent = recordText(r);
      li.appendChild(a); li.appendChild(b); li.appendChild(c); ol.appendChild(li);
    });
  }

  function load(game){
    current = game || current;
    $('lb-bot').classList.toggle('on', current === 'battleship-bot');
    $('lb-online').classList.toggle('on', current === 'battleship-online');
    ['wins', 'streak', 'shots'].forEach(function(k){ $('sort-' + k).classList.toggle('on', sort === k); });
    if (!RadAuth.sb) return;
    var q = RadAuth.sb.from('game_stats').select('wins,losses,best_streak,best_shots,profiles(username)').eq('game', current);
    if (sort === 'streak') q = q.gt('best_streak', 0).order('best_streak', { ascending: false });
    else if (sort === 'shots') q = q.not('best_shots', 'is', null).order('best_shots', { ascending: true });
    else q = q.order('wins', { ascending: false });
    Promise.resolve(q.limit(10)).then(function(r){ draw((r && r.data) || []); }).catch(function(){});
  }
  window.refreshLeaderboard = load;

  $('lb-bot').addEventListener('click', function(){ load('battleship-bot'); });
  $('lb-online').addEventListener('click', function(){ load('battleship-online'); });
  ['wins', 'streak', 'shots'].forEach(function(k){ $('sort-' + k).addEventListener('click', function(){ sort = k; load(); }); });
  RadAuth.mount($('acct'));
  RadAuth.onChange(function(){
    $('lb').hidden = !RadAuth.enabled;
    if (RadAuth.enabled){
      load();
      var n = $('lbnote');
      if (n && !n.textContent) n.textContent = RadAuth.user ? '' : 'Sign in to put your wins on the leaderboard.';
      if (n && RadAuth.user && n.textContent.indexOf('Sign in') === 0) n.textContent = '';
    }
  });
})();
</script>
